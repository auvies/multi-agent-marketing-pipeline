<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campaign Generator - Multi-Agent Marketing</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      max-width: 600px;
      width: 100%;
      padding: 40px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #333;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 5px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.3s;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    .loading {
      display: none;
      text-align: center;
      margin-top: 20px;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .result {
      display: none;
      margin-top: 30px;
      padding: 20px;
      background: #f5f5f5;
      border-radius: 5px;
      border-left: 4px solid #667eea;
    }

    .result h2 {
      color: #333;
      margin-bottom: 15px;
      font-size: 20px;
    }

    .result-content {
      color: #555;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
      max-height: 500px;
      overflow-y: auto;
      font-size: 13px;
    }

    .error {
      color: #d32f2f;
      margin-top: 15px;
      padding: 15px;
      background: #ffebee;
      border-radius: 5px;
      border-left: 4px solid #d32f2f;
      display: none;
    }

    .success {
      color: #388e3c;
      margin-top: 15px;
      padding: 15px;
      background: #e8f5e9;
      border-radius: 5px;
      border-left: 4px solid #388e3c;
      display: none;
    }

    .status {
      font-size: 12px;
      color: #999;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Campaign Generator</h1>
    <p class="subtitle">AI-Powered Social Media Campaign Creator</p>

    <form id="campaignForm">
      <div class="form-group">
        <label for="businessName">Business Name *</label>
        <input type="text" id="businessName" name="businessName" placeholder="e.g., Ahmad Sweets" required>
      </div>

      <div class="form-group">
        <label for="product">Product/Service *</label>
        <input type="text" id="product" name="product" placeholder="e.g., Special Barfi" required>
      </div>

      <div class="form-group">
        <label for="goal">Sales Goal *</label>
        <input type="text" id="goal" name="goal" placeholder="e.g., 200 packets per day" required>
      </div>

      <div class="form-group">
        <label for="tone">Brand Tone *</label>
        <input type="text" id="tone" name="tone" placeholder="e.g., warm, professional, playful" required>
      </div>

      <div class="form-group">
        <label for="description">Description (optional)</label>
        <textarea id="description" name="description" placeholder="Tell us more about your business..."></textarea>
      </div>

      <button type="submit">Generate Campaign</button>
    </form>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Creating your campaign...</p>
      <p class="status" id="status">Step 1/5: Analyzing audience...</p>
    </div>

    <div class="error" id="error"></div>
    <div class="success" id="success"></div>

    <div class="result" id="result">
      <h2>📋 Your Campaign</h2>
      <div class="result-content" id="resultContent"></div>
    </div>
  </div>

  <script>
    const API_URL = process.env.REACT_APP_API_URL || 'http://localhost:3001';

    const form = document.getElementById('campaignForm');
    const loading = document.getElementById('loading');
    const error = document.getElementById('error');
    const success = document.getElementById('success');
    const result = document.getElementById('result');
    const resultContent = document.getElementById('resultContent');
    const statusText = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = {
        businessName: document.getElementById('businessName').value,
        product: document.getElementById('product').value,
        goal: document.getElementById('goal').value,
        tone: document.getElementById('tone').value,
        description: document.getElementById('description').value
      };

      // Reset UI
      error.style.display = 'none';
      success.style.display = 'none';
      result.style.display = 'none';
      loading.style.display = 'block';

      try {
        const response = await fetch(`${API_URL}/api/campaign`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(formData)
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Failed to generate campaign');
        }

        loading.style.display = 'none';
        resultContent.textContent = JSON.stringify(data, null, 2);
        result.style.display = 'block';
        success.style.display = 'block';
        success.textContent = '✅ Campaign generated successfully!';

      } catch (err) {
        loading.style.display = 'none';
        error.style.display = 'block';
        error.textContent = '❌ Error: ' + err.message;
      }
    });
  </script>
</body>
</html>
